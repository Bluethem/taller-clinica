services:
  db:
    image: postgres:18
    container_name: sigc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigc}
      POSTGRES_DB: ${POSTGRES_DB:-sigc}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data under /var/lib/postgresql/<major>/...
      - pgdata:/var/lib/postgresql
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigc} -d ${POSTGRES_DB:-sigc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.dev
    container_name: sigc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sigc:sigc@db:5432/sigc}
      PORT: ${PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    volumes:
      - ./src/backend/src:/app/src
      - ./src/backend/test:/app/test
      - ./src/backend/nest-cli.json:/app/nest-cli.json
      - ./src/backend/tsconfig.json:/app/tsconfig.json
      - ./src/backend/tsconfig.build.json:/app/tsconfig.build.json

volumes:
  pgdata:
